      - kind: observe
        observation:
          observation_id: b3h-launch-source-b
          hypothesis_id: launch-window
          statement: The launch window is DAWN-624.
          evidence: {artifact_id: launch-source-b, excerpt_hash: "8888888888888888888888888888888888888888888888888888888888888888", reliability: 0.6}
    expected_hypotheses:
      - {id: launch-window, statement: The launch window is DAWN-624., probability: 0.92, status: supported, evidence_count: 2}
