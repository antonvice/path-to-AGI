          evidence: {artifact_id: unverified-rumor, excerpt_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa, reliability: 0.1}
    expected_hypotheses:
