    expected_answer_substrings: [ORBIT-356]
    forbidden_answer_substrings: [MIRAGE-000]
  - id: unresolved_ocean_relay
    objective: Decide which ocean relay phase is recorded.
    operations:
      - kind: unresolved
        question: Which ocean relay phase was recorded?
    expected_unresolved_questions: ["Which ocean relay phase was recorded?"]
    expected_answer_substrings: [unknown]
    forbidden_answer_substrings: [ORBIT-356]
  - id: cumulative_launch_support
    objective: Decide which launch window is established.
    operations:
