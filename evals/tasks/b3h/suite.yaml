version: 1
milestone: B3
purpose: held_out
promotion_eligible: true
minimum_quality_delta: 0.2
cases:
  - id: reactor_claim_refuted
    objective: Decide whether the reactor is stable.
    operations:
      - kind: observe
        observation:
          observation_id: b3h-reactor-monitor
          hypothesis_id: reactor-stability
          statement: The reactor is stable.
          evidence: {artifact_id: reactor-monitor, excerpt_hash: "1111111111111111111111111111111111111111111111111111111111111111", reliability: 0.85}
      - kind: observe
        observation:
          observation_id: b3h-reactor-probe
          hypothesis_id: reactor-stability
          statement: The reactor is stable.
          effect: refute
          evidence: {artifact_id: reactor-probe, excerpt_hash: "2222222222222222222222222222222222222222222222222222222222222222", reliability: 1.0}
    expected_hypotheses:
      - {id: reactor-stability, statement: The reactor is stable., probability: 0.0, status: refuted, evidence_count: 2}
    expected_answer_substrings: [refuted, The reactor is stable.]
  - id: weak_sensor_cause
    objective: Decide whether sensor drift is an established cause.
    operations:
      - kind: observe
        observation:
          observation_id: b3h-sensor-theory
          hypothesis_id: sensor-cause
          statement: Sensor drift caused the navigation fault.
          evidence: {artifact_id: tentative-analysis, excerpt_hash: "3333333333333333333333333333333333333333333333333333333333333333", reliability: 0.3}
    expected_hypotheses:
      - {id: sensor-cause, statement: Sensor drift caused the navigation fault., probability: 0.65, status: open, evidence_count: 1}
    expected_answer_substrings: [unknown]
    forbidden_answer_substrings: [Sensor drift]
  - id: conflicting_gate_modes
    objective: Decide which north gate mode is active.
    operations:
      - kind: observe
        observation:
          observation_id: b3h-gate-lime
          hypothesis_id: gate-lime
          statement: The north gate mode is LIME-447.
          evidence: {artifact_id: gate-source-lime, excerpt_hash: "4444444444444444444444444444444444444444444444444444444444444444", reliability: 1.0}
          contradicts: [gate-violet]
      - kind: observe
        observation:
          observation_id: b3h-gate-violet
          hypothesis_id: gate-violet
          statement: The north gate mode is VIOLET-812.
          evidence: {artifact_id: gate-source-violet, excerpt_hash: "5555555555555555555555555555555555555555555555555555555555555555", reliability: 1.0}
          contradicts: [gate-lime]
    expected_hypotheses:
      - {id: gate-lime, statement: The north gate mode is LIME-447., probability: 1.0, status: contradicted, contradicts: [gate-violet], evidence_count: 1}
      - {id: gate-violet, statement: The north gate mode is VIOLET-812., probability: 1.0, status: contradicted, contradicts: [gate-lime], evidence_count: 1}
    expected_answer_substrings: [conflict, LIME-447, VIOLET-812]
  - id: supported_archive_key
    objective: Decide which archive key is verified.
    operations:
      - kind: observe
        observation:
          observation_id: b3h-archive-key
